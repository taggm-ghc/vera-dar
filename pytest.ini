# RB-4 S-1 (tracked root pytest config). Its presence stops pytest's upward config search inside the repo, so no
# ancestor or untracked config file (pytest.ini, pyproject.toml, tox.ini, setup.cfg, ...) can add addopts, plugins,
# pythonpath, or move rootdir/confcutdir. The release gate pins it with `-c <repo>/pytest.ini --rootdir <repo>` and
# refuses to run if any other pytest config file is found. Keep it free of addopts.
[pytest]
